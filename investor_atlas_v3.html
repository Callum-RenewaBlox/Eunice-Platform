.pal-opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:var(--r-2);text-align:left;cursor:pointer}
.pal-opt[aria-selected="true"]{background:var(--wash);box-shadow:inset 0 0 0 1px var(--rule-2)}
.pal-ic{width:30px;height:30px;border-radius:var(--r-2);display:grid;place-items:center;background:var(--surface-2)}
.pal-n{font:500 13.5px/1.3 var(--font-ui);color:var(--ink-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-n u{text-decoration:underline;text-decoration-color:var(--lime-ink);text-decoration-thickness:2px;text-underline-offset:3px}
.pal-s{font:400 12px/1.3 var(--font-ui);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-v{text-align:right;font:500 12px/1.25 var(--font-ui);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pal-v small{display:block;font-weight:400;color:var(--ink-3);font-size:11px}
.pal-more{display:block;width:100%;padding:7px 10px 7px 50px;text-align:left;font:500 12px/1.2 var(--font-ui);color:var(--ink-2);border-radius:var(--r-2)}
.pal-more[aria-selected="true"],.pal-more:hover{background:var(--wash)}
.pal-empty{padding:18px 10px;font:italic 400 15px/1.4 var(--font-display);color:var(--ink-2)}
.pal-sugg{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 12px}
.palette-foot{display:flex;gap:16px;align-items:center;padding:9px 16px;border-top:1px solid var(--rule);font:400 11.5px/1 var(--font-ui);color:var(--ink-3)}
.palette-foot .kbd{margin-right:3px}
.palette-count{margin-left:auto;font-variant-numeric:tabular-nums}
.drawer{position:fixed;inset:0;z-index:90}
.drawer[hidden]{display:none}
.drawer-scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn var(--dur-2) var(--ease)}
.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(480px,100vw);display:flex;flex-direction:column;background:var(--surface-1);color:var(--ink-1);box-shadow:var(--sh-3);
  animation:drawerIn var(--dur-3) var(--ease)}
@keyframes drawerIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.dr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 18px 12px 24px;border-bottom:1px solid var(--rule)}
.dr-title{margin:0;font:500 22px/1.15 var(--font-display);letter-spacing:-.01em}
.dr-body{flex:1;overflow-y:auto;padding:6px 24px 28px}
.dr-sec{border-top:1px solid var(--rule-strong);margin-top:18px;padding-top:10px}
.dr-sec:first-child{border-top:0;margin-top:8px}
.dr-sec h3{margin:0 0 8px;font:600 10.5px/1.3 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-1)}
.dr-sec p,.dr-sec li{font:400 13px/1.55 var(--font-ui);color:var(--ink-2)}
.dr-sec p{margin:0 0 8px}
.dr-sec ul{margin:0;padding-left:18px}
.dr-sec dl{margin:0;display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:6px 14px;font:400 12.5px/1.45 var(--font-ui)}
.dr-sec dt{font-weight:600;color:var(--ink-1)}
.dr-sec dd{margin:0;color:var(--ink-2)}
.dr-sec table{width:100%;border-collapse:collapse;font:400 12.5px/1.4 var(--font-ui);font-variant-numeric:tabular-nums}
.dr-sec th,.dr-sec td{padding:5px 6px;border-top:1px solid var(--rule);text-align:left}
.dr-sec td.n,.dr-sec th.n{text-align:right}
.dr-asof{margin-top:22px;font:400 12px/1.4 var(--font-ui);color:var(--ink-3)}
.modal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:24px}
.modal[hidden]{display:none}
.modal-scrim{position:absolute;inset:0;background:var(--scrim);animation:fadeIn var(--dur-2) var(--ease)}
.modal-box{position:relative;display:flex;flex-direction:column;width:min(560px,100%);max-height:min(720px,calc(100dvh - 48px));background:var(--surface-1);color:var(--ink-1);
  border:1px solid var(--rule);border-radius:var(--r-4);box-shadow:var(--sh-3);overflow:hidden;animation:modalIn var(--dur-3) var(--ease)}
.modal-box.modal-sm{width:min(460px,100%)}
.modal-box.modal-wide{width:min(860px,100%);height:min(720px,calc(100dvh - 48px))}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 16px 12px 24px;border-bottom:1px solid var(--rule)}
.modal-title{margin:0;font:500 22px/1.15 var(--font-display);letter-spacing:-.01em}
.modal-sub{margin:5px 0 0;font:400 12.5px/1.4 var(--font-ui);color:var(--ink-3)}
.modal-body{flex:1;min-height:0;overflow-y:auto;padding:14px 24px 22px;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
.modal-body p{margin:0 0 10px;font:400 15px/1.5 var(--font-display);color:var(--ink-2)}
.modal-body p.modal-foot{margin-top:14px;font:400 12px/1.4 var(--font-ui);color:var(--ink-3)}
.modal-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.modal-acts.top{margin:0 0 12px}
.keys{width:100%;border-collapse:collapse;font:400 13px/1.35 var(--font-ui)}
.keys th{padding:7px 12px 7px 0;text-align:left;font-weight:400;white-space:nowrap;width:1%}
.keys td{padding:7px 0;color:var(--ink-2)}
.keys tr + tr th,.keys tr + tr td{border-top:1px solid var(--rule)}
.keys .kbd{font-size:11.5px;padding:4px 7px;color:var(--ink-1)}
.sites-wrap{overflow-x:auto}
.sites-t{width:100%;border-collapse:collapse;font:400 12.5px/1.35 var(--font-ui);font-variant-numeric:tabular-nums}
.sites-t thead th{position:sticky;top:-14px;z-index:1;background:var(--surface-1);border-bottom:1px solid var(--rule-strong);padding:0;text-align:left;font-weight:600}
.sites-t thead th button{display:flex;align-items:center;gap:4px;width:100%;padding:8px 8px 7px;font:600 10.5px/1.2 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}
.sites-t thead th.n button{justify-content:flex-end}
.sites-t thead th[aria-sort="ascending"] button,.sites-t thead th[aria-sort="descending"] button{color:var(--ink-1)}
.sites-t .st{font-size:8px;min-width:8px}
.sites-t td,.sites-t tbody th{padding:6px 8px;border-top:1px solid var(--rule);text-align:left;font-weight:400;color:var(--ink-2)}
.sites-t td{white-space:nowrap}
.sites-t td.n{text-align:right;color:var(--ink-1)}
.sites-t tbody th{color:var(--ink-1);max-width:320px}
.st-open{display:flex;align-items:center;gap:8px;text-align:left;font:500 12.5px/1.3 var(--font-ui);color:var(--ink-1)}
.st-open span{overflow:hidden;text-overflow:ellipsis}
.st-open:hover span{text-decoration:underline;text-underline-offset:3px}
.sites-t tbody tr:hover{background:var(--wash)}
.pc-form{display:flex;gap:8px;align-items:stretch}
.pc-form input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:var(--r-2);border:1px solid var(--rule-2);background:var(--surface-1);font:500 15px/1 var(--font-ui);letter-spacing:.04em;text-transform:uppercase}
.pc-form input::placeholder{text-transform:none;letter-spacing:0;color:var(--ink-4)}
.pc-form .btn{height:40px}
.pc-msg{min-height:1.4em;margin:10px 0 0;font:400 12.5px/1.4 var(--font-ui);color:var(--ink-3)}
.pc-msg.err{color:var(--status-critical)}
@media (max-width:760px){
  .modal{padding:0;place-items:end stretch}
  .modal-box,.modal-box.modal-sm,.modal-box.modal-wide{width:100%;max-height:92dvh;height:auto;border-radius:16px 16px 0 0}
  .modal-box.modal-wide{height:92dvh}
  .modal-top{padding:16px 12px 10px 16px}
  .modal-body{padding:12px 16px 20px}
}

low) await a figure. Card offtaker is inferred from the largest external REGO certificate holder — strong evidence of who buys the power, not contractual proof. Full detail on the PPA Benchmark tab.","tam":"Markers are unfilled: ring colour = technology, shape = subsidy (triangle = RO, circle = FiT), size = capacity, dashed = approximate location. BM tier is indicative, modelled from the verified SAM sites. TCV Potential applies the priced SAM sites’ own Year-5 TCV per kW-available (by tier) to each site’s available-for-BM capacity — the DNO maximum export capacity where the register gives one (727 sites), otherwise installed capacity at the SAM fleet’s ratio. Scotland sits outside the modelled tiers, so it carries no BM revenue and is excluded from TCV Potential.","hydro":"Stranded generation runs Bitcoin mining 24/7 — no grid export and no BM revenue, so TCV = mined BTC value."},"labels":{"tiers":{"1":"Tier 1 · Highest","2":"Tier 2 · Strong","3":"Tier 3 · Moderate","4":"Tier 4 · Modest","5":"Tier 5 · Lower","0":"Scotland · no BM revenue"},"tierShort":{"1":"Highest","2":"Strong","3":"Moderate","4":"Modest","5":"Lower"},"export":{"neg":"Negotiated PPA","fit":"FiT standard","btm":"Behind meter","unk":"Unknown"},"conf":["High","Medium","Low","Unverified"],"hydroExport":["Export-limited","No export"],"families":["Landfill gas","Digestion gas","Thermal","Other fuels"],"fuels":["Landfill gas","Fuelled (biomass/AD/EfW)","Biomass","Waste / EfW","Biogas (AD)","Sewage gas","Advanced fuel","Biofuel - other","Biodiesel"],"rego":{"active":"active","declining":"lagging/winding down","ceased":"likely ceased","none":"no REGO certs"},"ppaClass":{"neg":"Negotiated export PPA","fit":"FiT standard export tariff (no PPA)","btm":"No export — behind the meter","unk":"Unknown — no FiT match"}},"bmrev":{"1":{"a":"29.6","t":"122"},"2":{"a":"25.3","t":"104"},"3":{"a":"21.7","t":"80"},"4":{"a":"18.0","t":"61"},"5":{"a":"16.0","t":"50"}},"bmfreq":{"1":"~2× GB average","2":"~1.5× GB average"},"legend":{"sam":{"title":"Balancing Mechanism tiers","sub":"Avg BM price against 8.0p wholesale","pricingTitle":"Contract value","awaiting":"Awaiting BM figure"},"tam":{"title":"Subsidised generators","subsidyTitle":"SUBSIDY · SHAPE","techTitle":"TECHNOLOGY · RING","tierTitle":"BM TIER · INDICATIVE","scaleTitle":"SCALE","techNote":"Colours group fuels into three families for colour-blind legibility; each site card names its exact fuel.","techNoteFuels":"Ring colour shows each site's fuel; shape shows its subsidy. Each site card names its fuel.","tierCaption":"Filter only; not shown by colour on the map."},"hydro":{"title":"Stranded Hydro","exportTitle":"Export class","confTitle":"Confidence"}},"cards":{"offtakerTip":"Inferred from the largest external REGO certificate holder: strong evidence of who buys the power, not contractual proof.","hydroExplain":"Installed capacity (FiT register) exceeds the export capacity (MEC) the network operator allows, so this share of output has nowhere to go.","hydroNoExport":"No export connection on the register, so the whole output is stranded behind the meter.","mailSubject":"RenewaBlox — {name}, {town} ({outcode})","mailBody":"Hi Callum,\n\nI'd like to talk about {name} ({postcode}): {tier}, {installed} kW installed.\n\nLink: {url}\n"},"drawer":{"title":"Sources & method","sources":["Ofgem FiT Installation Report (Mar 2026)","Ofgem RO / REGO registers (Aug 2026)","DNO Embedded Capacity Registers (NGED, NPG, SPEN, SSEN Jul-2026, UKPN)","Elexon BMRS MID","Montel / EEX (11 Aug 2026)","postcodes.io","OpenFreeMap / © OpenStreetMap contributors","Natural Earth","AWS Terrain Tiles"],"provenance":"<b>Provenance.<\/b> Realised prices — Elexon BMRS Market Index Data, APXMIDP feed, 70,085 half-hourly settlement records Aug 2024–Jul 2026 (the N2EX feed reports zero volume and is excluded). Forward curve — Montel, EEX UK power futures, previous-settlement column, snapshot 11 Aug 2026. Export arrangement and FiT tariffs — Ofgem Feed-in Tariff In     function drawPrice() {

      var narrow = W < 600;
      var M = { l: 44, r: narrow ? 64 : 96, t: 34, b: 36 };
      var iw = W - M.l - M.r, ih = H - M.t - M.b;
      var s = elSvg;

      s.setAttribute('width', W); s.setAttribute('height', H);
      s.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

      /* grid + y ticks */

      }
      text(gAx, 0, 12, 'p/kWh', 'axlab', 'start');
      /* x ticks */

        var mo = ((i % 12) + 12) % 12;

        svg('line', { x1: X(i), x2: X(i), y1: Y(yMin), y2: Y(yMin) + 4, 'class': 'base' }, gAx);
        text(gAx, X(i), H - M.b + 19, narrow ? String(Math.floor(i / 12)) : idxLabel(i), 'tick', 'middle');
      }
      svg('line', { x1: M.l, x2: M.l + iw, y1: Y(yMin), y2: Y(yMin), 'class': 'base' }, gAx);

      /* today divider */
      var todayI = mIdx(real[real.length - 1].m) + 1, tx = X(todayI);
      svg('line', { x1: tx, x2: tx, y1: M.t - 20, y2: Y(yMin), 'class': 'today' }, gAx);
      boxes.push(bb(text(gAx, tx - 6, M.t - 10, 'realised', 'axlab era', 'end')));
      boxes.push(bb(text(gAx, tx + 6, M.t - 10, 'forward', 'axlab era', 'start')));

      /* realised area + line + dots */
      var pts = real.map(function (d) { return [X(mIdx(d.m) + 0.5), Y(d.p)]; });
      var area = 'M' + pts[0][0] + ',' + Y(yMin) + ' L' + pts.map(function (p) { return p.join(','); }).join(' L') + ' L' + pts[pts.length - 1][0] + ',' + Y(yMin) + ' Z';
      var gD = svg('g', { 'class': 'data' }, s);
      svg('path', { d: area, 'class': 'real-area' }, gD);

      /* FiT rule + CPI path */
      var fit = P.fit, cpi = P.cpi;
      svg('line', { x1: M.l, x2: M.l + iw, y1: Y(fit), y2: Y(fit), 'class': 'fit' }, gD);
