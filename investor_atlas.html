<style>
:root{--ink:#16242b;--teal:#1F6F78;--panel:#fff;--line:#e3e8ea;--muted:#6b7a80;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100vh}
header{background:linear-gradient(90deg,#16323a,#1F6F78);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:11px;opacity:.82;margin-top:2px}
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.13);padding:3px;border-radius:9px}
.tabs button{border:0;background:transparent;color:#fff;opacity:.8;padding:6px 14px;font-size:12.5px;border-radius:7px;cursor:pointer;font-weight:600}
.tabs button.on{background:#fff;color:#16323a;opacity:1}
.kpis{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.kpi{text-align:center;line-height:1.15}
.kpi b{font-size:16px;display:block}
.kpi span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.8}
#main{flex:1;display:flex;min-height:0}
#panel{width:262px;background:var(--panel);border-right:1px solid var(--line);padding:14px 14px 10px;overflow:auto}
#map{flex:1}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:2px 0 7px;font-weight:700}
.row{display:flex;align-items:center;gap:9px;padding:6px;border-radius:7px;cursor:pointer;font-size:13px;user-select:none}
.row:hover{background:#f3f6f6}.row.off{opacity:.4}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.row .c{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.up{color:var(--teal);font-weight:700}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}
.leaflet-popup-content{margin:0;width:250px!important}
.pp h3{margin:0;padding:9px 12px;color:#fff;font-size:14px;border-radius:2px 2px 0 0}
.pp .meta{padding:3px 12px 0;font-size:11px;color:var(--muted)}
.pp table{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:12px}
.pp td{padding:3px 12px}.pp td.v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.pp tr.hl td{background:#f3f8f8}.pp tr.hl td.v{color:var(--teal)}
.scope{display:flex;gap:3px;background:rgba(255,255,255,.13);padding:3px;border-radius:9px}
.scope button{border:0;background:transparent;color:#fff;opacity:.72;padding:5px 12px;font-size:11.5px;border-radius:7px;cursor:pointer;font-weight:700;letter-spacing:.3px}
.scope button.on{background:rgba(255,255,255,.92);color:#16323a;opacity:1}
.ring{width:14px;height:14px;border-radius:50%;flex:none;background:#fff;border:2.5px solid #999;box-sizing:border-box}
.sub2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:15px 0 7px;font-weight:700;border-top:1px solid var(--line);padding-top:12px}
.foot{font-size:10px;color:#9aa7ac;padding:6px 18px;border-top:1px solid var(--line);background:#fafbfb}
</style></head>

    sub:'Total Contract Value \u00b7 Year 5 \u00b7 129 AD-peaker sites in the GB Balancing Mechanism'};
}
function vis(d){const c=cfg();
  if(c.view==='tam')return !hidden.tam.has(d.bt)&&!hidden.fuel.has(d.f);
  return !c.hidden.has(d[c.key]);}
function radius(d,data){
  if(cfg().view==='tam'){const kw=d.kw||0;return Math.max(2.8,Math.min(17,2.8+Math.sqrt(kw)/14));}
  if(d.tcv==null)return 4;
  const mx=Math.max(...data.filter(x=>x.tcv!=null).map(x=>x.tcv));return 5+22*Math.sqrt(d.tcv/mx);}
function tampop(d){
  const t=TAMPAL[d.bt]||TAMPAL[0];
  const sub=d.ro?'RO accredited':(d.src==='FiT'?'FiT accredited':'Not confirmed');
  const loc=d.p==='approx'?'Approx \u00b7 outcode centroid':'Exact \u00b7 DNO register';
  return `<div class="pp"><h3 style="background:${t.c}">${esc(d.n)}</h3>
  <div class="meta">${esc(d.f)} &nbsp;|&nbsp; ${esc(d.s)}</div><table>
  <tr><td>Capacity</td><td class="v">${d.kw!=null?d.kw.toLocaleString()+' kW':'<i>unknown</i>'}</td></tr>
  <tr><td>Technology</td><td class="v" style="font-weight:500">${esc(d.f)}</td></tr>
  <tr class="hl"><td>${d.bt?'BM tier':'BM status'}</td><td class="v">${t.n}</td></tr>
  <tr><td>Subsidy</td><td class="v" style="font-weight:500">${sub}</td></tr>
  <tr><td>Location</td><td class="v" style="font-weight:500">${loc}</td></tr>
  </table></div>`;}
function popup(d){
  const c=cfg(); if(c.view==='tam')return tampop(d);
  const col=c.pal[d[c.key]].c;
  if(c.view==='sam'){
    const meta=[d.tn,d.pc,d.g].filter(Boolean).join(' \u00b7 ');
    const hd=(d.tcv==null)?'#9aa0a6':col;
    const body=(d.tcv==null)
      ? `<tr><td>Installed capacity</td><td class="v">${d.inst!=null?d.inst.toLocaleString()+' kW':'<i>unknown</i>'}</td></tr><tr class="hl"><td>Status</td><td class="v">Awaiting BM figure</td></tr>`
      : `<tr><td>Installed capacity</td><td class="v">${d.inst.toLocaleString()} kW</td></tr><tr><td>Available for BM</td><td class="v">${d.av.toLocaleString()} kW</td></tr><tr><td>BTC mined (Yr 5)</td><td class="v">${d.btc.toFixed(3)}</td></tr><tr class="hl"><td>TCV \u00b7 no treasury</td><td class="v">${gbp0(d.tcv)}</td></tr><tr class="hl"><td>TCV \u00b7 treasury</td><td class="v">${gbp0(d.tcvT)}</td></tr>`;
    return `<div class="pp"><h3 style="background:${hd}">${d.n}</h3>
    <div class="meta">${TIER[d.t].n}${meta?' &nbsp;|&nbsp; '+meta:''}</div><table>${body}
    ${d.dev?'<tr><td>Operator</td><td class="v" style="font-weight:500">'+d.dev.slice(0,28)+'</td></tr>':''}
    </table></div>`;}
  return `<div class="pp"><h3 style="background:${col}">${d.n}</h3>
  <div class="meta">Stranded hydro \u00b7 ${HCAT[d.exp].n} \u00b7 ${d.conf} confidence</div><table>
  <tr><td>Stranded capacity</td><td class="v">${d.kw.toLocaleString()} kW</td></tr>
  <tr><td>BTC mined (Yr 5)</td><td class="v">${d.btc.toFixed(3)}</td></tr>
  <tr><td>Energy export</td><td class="v">\u00a30 \u00b7 100% mining</td></tr>
  <tr class="hl"><td>TCV \u00b7 no treasury</td><td class="v">${gbp0(d.tcv)}</td></tr>
  <tr class="hl"><td>TCV \u00b7 treasury</td><td class="v">${gbp0(d.tcvT)}</td></tr>
  </table></div>`;}
function draw(){
  const c=cfg(); layer.clearLayers(); const pts=[]; const tam=c.view==='tam';
  c.data.forEach(d=>{ if(!vis(d))return;
    const col=tam?(TAMPAL[d.bt]||TAMPAL[0]).c:((d.tcv==null)?'#c2c8cd':c.pal[d[c.key]].c);
    L.circleMarker([d.lat,d.lon],{radius:radius(d,c.data),
      color:tam?fcol(d.f):'#fff',weight:tam?1.8:1,fillColor:col,
      fillOpacity:tam?.88:(d.tcv==null?.6:.82)})
     .bindPopup(popup(d)).addTo(layer); pts.push([d.lat,d.lon]); });
  if(pts.length)map.fitBounds(pts,{padding:[34,34],maxZoom:9});}
function kpis(){
  const c=cfg(); let items;
  if(c.view==='tam'){
    const v=TAM.filter(vis), kw=a=>Math.round(a.reduce((x,d)=>x+(d.kw||0),0)/1000).toLocaleString();
    items=[[v.length.toLocaleString(),'Sites'],[kw(v)+' MW','Capacity'],
           [kw(v.filter(d=>d.bt>0))+' MW','In BM tiers'],[kw(v.filter(d=>!d.bt))+' MW','No BM \u00b7 Scotland']];
  } else {
    const vv=c.data.filter(d=>!c.hidden.has(d[c.key])&&d.tcv!=null), sum=f=>vv.reduce((a,d)=>a+d[f],0);
    const caplab=c.view==='sam'?'Avail. for BM':'Stranded';
    items=[[vv.length,'Sites'],[(sum('kw')/1000).toFixed(1)+' MW',caplab],
           [Math.round(sum('btc')),'BTC mined'],[abbr(sum('tcv')),'TCV'],[abbr(sum('tcvT')),'TCV (Treasury)']];
  }
  document.getElementById('kpis').innerHTML=items.map(k=>`<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('');}
function legend(){
  const c=cfg(); document.getElementById('legTitle').textContent=c.title;
  const cnt={}; c.data.forEach(d=>cnt[d[c.key]]=(cnt[d[c.key]]||0)+1);
  let html='';
  if(c.view==='tam'){
    const fc={}; TAM.forEach(d=>fc[d.f]=(fc[d.f]||0)+1);
    html=[1,2,3,4,5,0].map(t=>`<div class="row ${hidden.tam.has(t)?'off':''}" data-g="t" data-k="${t}"><span class="dot" style="background:${TAMPAL[t].c}"></span>${TAMPAL[t].n}<span class="c">${cnt[t]||0}</span></div>`).join('');
    html+='<div class="sub2">Technology \u00b7 circle ring</div>';
    html+=Object.keys(FUELC).filter(f=>fc[f]).map(f=>`<div class="row ${hidden.fuel.has(f)?'off':''}" data-g="f" data-k="${f}"><span class="ring" style="border-color:${FUELC[f]}"></span>${f}<span class="c">${fc[f]}</span></div>`).join('');
    document.getElementById('baseNote').innerHTML='Circle <b>fill</b> = Balancing Mechanism tier, <b>ring</b> = technology, size = capacity. Tier is modelled from the nearest verified SAM sites (89% match on hold-out) \u2014 indicative, not a per-site valuation. Scotland sits outside the modelled BM tiers, so no BM revenue is attributed.';
  } else if(c.view==='sam'){
    html=Object.keys(TIER).map(t=>{const up=Math.round((TAVG[t]/WHOLESALE-1)*100);
      return `<div class="row ${c.hidden.has(+t)?'off':''}" data-g="s" data-k="${t}"><span class="dot" style="background:${TIER[t].c}"></span>${TIER[t].n}<span class="c">${cnt[t]||0} &middot; <b class="up">+${up}%</b></span></div>`;}).join('');
    document.getElementById('baseNote').innerHTML='+% = average BM revenue per tier vs a wholesale market baseline. TCV is per kW of available-for-BM; 24 sites (grey) await a figure.';
  } else {
    html=Object.keys(HCAT).map(k=>`<div class="row ${c.hidden.has(k)?'off':''}" data-g="s" data-k="${k}"><span class="dot" style="background:${HCAT[k].c}"></span>${HCAT[k].n}<span class="c">${cnt[k]||0}</span></div>`).join('');
    document.getElementById('baseNote').innerHTML='Stranded generation runs Bitcoin mining 24/7 \u2014 no grid export and no BM revenue, so TCV = mined BTC value.';
  }
  document.getElementById('legend').innerHTML=html;
  document.querySelectorAll('.row').forEach(el=>el.onclick=()=>{
    const g=el.dataset.g; let k=el.dataset.k;
    if(g==='t'){k=+k; hidden.tam.has(k)?hidden.tam.delete(k):hidden.tam.add(k);}
    else if(g==='f'){hidden.fuel.has(k)?hidden.fuel.delete(k):hidden.fuel.add(k);}
    else {const c2=cfg(); if(c2.view==='sam')k=+k; c2.hidden.has(k)?c2.hidden.delete(k):c2.hidden.add(k);}
    render();});}
function foot(){
  const c=cfg();
  document.getElementById('foot').textContent = c.view==='tam'
    ? 'RenewaBlox Investor Atlas \u00b7 TAM \u2014 all subsidised biogas, biomass, EfW, landfill and sewage-gas CHP. Sources: DNO Embedded Capacity Registers (NGED, NPG, SPEN, SSEN Jul-2026, UKPN) + Ofgem FiT and RO registers. 335 sites are plotted at outcode centroid (dashed-ring precision \u201capprox\u201d). BM tier modelled from the 129 verified SAM sites; Scotland is outside the modelled tiers.'
    : 'RenewaBlox Investor Atlas · Year-5 Total Contract Values modelled from the Scrivelsby peaker and 1,000 kW stranded-hydro client cases, scaled across the portfolio. Sources: RenewaBlox_AD_BM_CRM & RenewaBlox_Hydro_Stranded (16 Jun 2026). Indicative; not investment advice.';}
function render(){legend();kpis();draw();foot();document.getElementById('sub').innerHTML=cfg().sub;
  document.getElementById('scope').style.display=(mode==='peaker')?'flex':'none';}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.mode; render();
});
document.querySelectorAll('#scope button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#scope button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); scope=b.dataset.scope; mode='peaker';
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.mode==='peaker'));
  render();
});
render();
</script></body></html>
