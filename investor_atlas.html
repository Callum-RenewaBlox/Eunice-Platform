<style>
:root{--ink:#16242b;--teal:#1F6F78;--panel:#fff;--line:#e3e8ea;--muted:#6b7a80;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink)}
#app{display:flex;flex-direction:column;height:100vh}
header{background:linear-gradient(90deg,#16323a,#1F6F78);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{font-size:11px;opacity:.82;margin-top:2px}
.tabs{display:flex;gap:3px;background:rgba(255,255,255,.13);padding:3px;border-radius:9px}
.tabs button{border:0;background:transparent;color:#fff;opacity:.8;padding:6px 14px;font-size:12.5px;border-radius:7px;cursor:pointer;font-weight:600}
.tabs button.on{background:#fff;color:#16323a;opacity:1}
.kpis{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.kpi{text-align:center;line-height:1.15}
.kpi b{font-size:16px;display:block}
.kpi span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;opacity:.8}
#main{flex:1;display:flex;min-height:0}
#panel{width:262px;background:var(--panel);border-right:1px solid var(--line);padding:14px 14px 10px;overflow:auto}
#map{flex:1}
.sect{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:2px 0 7px;font-weight:700}
.row{display:flex;align-items:center;gap:9px;padding:6px;border-radius:7px;cursor:pointer;font-size:13px;user-select:none}
.row:hover{background:#f3f6f6}.row.off{opacity:.4}
.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.06)}
.row .c{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.up{color:var(--teal);font-weight:700}
.note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}
.leaflet-popup-content{margin:0;width:250px!important}
.pp h3{margin:0;padding:9px 12px;color:#fff;font-size:14px;border-radius:2px 2px 0 0}
.pp .meta{padding:3px 12px 0;font-size:11px;color:var(--muted)}
.pp table{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:12px}
.pp td{padding:3px 12px}.pp td.v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.pp tr.hl td{background:#f3f8f8}.pp tr.hl td.v{color:var(--teal)}
.foot{font-size:10px;color:#9aa7ac;padding:6px 18px;border-top:1px solid var(--line);background:#fafbfb}
</style></head>

const TIER={1:{c:'#7B1E1E',n:'Tier 1 · Highest'},2:{c:'#D7301F',n:'Tier 2 · Strong'},3:{c:'#E67E22',n:'Tier 3 · Moderate'},4:{c:'#F1C40F',n:'Tier 4 · Modest'},5:{c:'#9AA7AC',n:'Tier 5 · Lower'}};
const HCAT={'Export':{c:'#2E86C1',n:'Export-limited'},'No export':{c:'#1A5276',n:'No export'}};
const WHOLESALE=8.0, TAVG={1:29.6,2:25.3,3:21.7,4:18.0,5:16.0};
const gbp0=v=>'£'+Math.round(v).toLocaleString('en-GB');
const abbr=v=>{v=Math.round(v);if(v>=1e6)return '£'+(v/1e6).toFixed(1)+'M';if(v>=1e3)return '£'+(v/1e3).toFixed(0)+'k';return '£'+v;};
let mode='peaker', hidden={peaker:new Set(),hydro:new Set()};
const map=L.map('map',{scrollWheelZoom:true}).setView([54.5,-3],6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
let layer=L.layerGroup().addTo(map);
function cfg(){
  return mode==='peaker'
   ? {data:PEAKER,key:'t',pal:TIER,hidden:hidden.peaker,title:'Balancing Mechanism Tiers',
      sub:'Total Contract Value · Year 5 · 129 AD-peaker sites in the GB Balancing Mechanism'}
   : {data:HYDRO,key:'exp',pal:HCAT,hidden:hidden.hydro,title:'Stranded Hydro',
      sub:'Total Contract Value · Year 5 · 57 stranded hydro units · 100% Bitcoin mining'};
}
function radius(d,data){if(d.tcv==null)return 4;const mx=Math.max(...data.filter(x=>x.tcv!=null).map(x=>x.tcv));return 5+22*Math.sqrt(d.tcv/mx);}
function popup(d){
  const c=cfg(), col=c.pal[d[c.key]].c;
  if(mode==='peaker'){
    const meta=[d.tn,d.pc,d.g].filter(Boolean).join(' · ');
    const hd=(d.tcv==null)?'#9aa0a6':col;
    const body=(d.tcv==null)
     ? `<tr><td>Installed capacity</td><td class="v">${d.inst!=null?d.inst.toLocaleString()+' kW':'<i>unknown</i>'}</td></tr><tr><td>Available for BM</td><td class="v"><i>unknown</i></td></tr><tr class="hl"><td>TCV</td><td class="v">pending</td></tr>`
     : `<tr><td>Installed capacity</td><td class="v">${d.inst.toLocaleString()} kW</td></tr><tr><td>Available for BM</td><td class="v">${d.av.toLocaleString()} kW</td></tr><tr><td>BTC mined (Yr 5)</td><td class="v">${d.btc.toFixed(3)}</td></tr><tr><td>Energy export</td><td class="v">${gbp0(d.en)}</td></tr><tr class="hl"><td>TCV — no treasury</td><td class="v">${gbp0(d.tcv)}</td></tr><tr class="hl"><td>TCV — treasury</td><td class="v">${gbp0(d.tcvT)}</td></tr>`;
    return `<div class="pp"><h3 style="background:${hd}">${d.n}</h3>
     <div class="meta">${TIER[d.t].n}${meta?' &nbsp;|&nbsp; '+meta:''}</div><table>${body}
     ${d.dev?'<tr><td>Operator</td><td class="v" style="font-weight:500">'+d.dev.slice(0,28)+'</td></tr>':''}
     </table></div>`;
  }
  return `<div class="pp"><h3 style="background:${col}">${d.n}</h3>
   <div class="meta">Stranded hydro · ${HCAT[d.exp].n} · ${d.conf} confidence</div><table>
   <tr><td>Stranded capacity</td><td class="v">${d.kw.toLocaleString()} kW</td></tr>
   <tr><td>BTC mined (Yr 5)</td><td class="v">${d.btc.toFixed(3)}</td></tr>
   <tr><td>Energy export</td><td class="v">£0 · 100% mining</td></tr>
   <tr class="hl"><td>TCV — no treasury</td><td class="v">${gbp0(d.tcv)}</td></tr>
   <tr class="hl"><td>TCV — treasury</td><td class="v">${gbp0(d.tcvT)}</td></tr>
   </table></div>`;
}
function draw(){
  const c=cfg(); layer.clearLayers(); const pts=[];
  c.data.forEach(d=>{ if(c.hidden.has(d[c.key]))return;
    const col=(d.tcv==null)?'#c2c8cd':c.pal[d[c.key]].c;
    L.circleMarker([d.lat,d.lon],{radius:radius(d,c.data),color:'#fff',weight:1,fillColor:col,fillOpacity:d.tcv==null?.6:.82})
     .bindPopup(popup(d)).addTo(layer); pts.push([d.lat,d.lon]); });
  if(pts.length)map.fitBounds(pts,{padding:[34,34],maxZoom:9});
}
function kpis(){
  const c=cfg(), vis=c.data.filter(d=>!c.hidden.has(d[c.key])&&d.tcv!=null), sum=f=>vis.reduce((a,d)=>a+d[f],0);
  const caplab=mode==='peaker'?'Avail. for BM':'Stranded';
  document.getElementById('kpis').innerHTML=[
   [vis.length,'Sites'],[(sum('kw')/1000).toFixed(1)+' MW',caplab],
   [Math.round(sum('btc')),'BTC mined'],[abbr(sum('tcv')),'TCV'],[abbr(sum('tcvT')),'TCV (Treasury)'],
  ].map(k=>`<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join('');
}
function legend(){
  const c=cfg(); document.getElementById('legTitle').textContent=c.title;
  const cnt={}; c.data.forEach(d=>cnt[d[c.key]]=(cnt[d[c.key]]||0)+1);
  let html='';
  if(mode==='peaker'){
    html=Object.keys(TIER).map(t=>{const up=Math.round((TAVG[t]/WHOLESALE-1)*100);
      return `<div class="row ${c.hidden.has(+t)?'off':''}" data-k="${t}"><span class="dot" style="background:${TIER[t].c}"></span>${TIER[t].n}<span class="c">${cnt[t]||0} &middot; <b class="up">+${up}%</b></span></div>`;}).join('');
    document.getElementById('baseNote').innerHTML='+% = average BM revenue per tier vs a wholesale market baseline. TCV is per kW of available-for-BM; 24 sites (grey) await a figure.';
  } else {
    html=Object.keys(HCAT).map(k=>`<div class="row ${c.hidden.has(k)?'off':''}" data-k="${k}"><span class="dot" style="background:${HCAT[k].c}"></span>${HCAT[k].n}<span class="c">${cnt[k]||0}</span></div>`).join('');
    document.getElementById('baseNote').innerHTML='Stranded generation runs Bitcoin mining 24/7 — no grid export and no BM revenue, so TCV = mined BTC value.';
  }
  document.getElementById('legend').innerHTML=html;
  document.querySelectorAll('.row').forEach(el=>el.onclick=()=>{
    let k=el.dataset.k; if(mode==='peaker')k=+k;
    c.hidden.has(k)?c.hidden.delete(k):c.hidden.add(k); render();
  });
}
function render(){legend();kpis();draw();document.getElementById('sub').textContent=cfg().sub;}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.mode; render();
});
document.getElementById('foot').textContent='RenewaBlox Investor Atlas · Year-5 Total Contract Values modelled from the Scrivelsby peaker and 1,000 kW stranded-hydro client cases, scaled across the portfolio. Sources: RenewaBlox_AD_BM_CRM & RenewaBlox_Hydro_Stranded (16 Jun 2026). Indicative; not investment advice.';
render();
