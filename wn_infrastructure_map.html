function nearestOnLines(P,polys){let best=1e12,bp=null;const p=xy(P);
 for(const c of polys){for(let i=0;i<c.length-1;i++){const a=xy(c[i]),b=xy(c[i+1]);
   const bx=b[0]-a[0],by=b[1]-a[1];let t=((p[0]-a[0])*bx+(p[1]-a[1])*by)/((bx*bx+by*by)||1e-9);t=Math.max(0,Math.min(1,t));
   const cx=a[0]+t*bx,cy=a[1]+t*by,d=Math.hypot(p[0]-cx,p[1]-cy);
   if(d<best){best=d;bp=[c[i],c[i+1],t];}}}

 '</details><details class="sec"><summary class="sh">Active Network Management (ANM) <span style="font-weight:normal;text-transform:none;color:#888">(toggle layer)</span></summary><div class="note" style="border:0;margin:0 0 5px;padding:0">West Newton sits inside the <b>Creyke Beck GSP</b> group — one of NPg’s <b>four approved ANM rollout GSPs</b> (with Saltend North, Keadby, Grimsby West). NPg’s established <b>Driffield 66 kV ANM scheme</b> manages generator <b>export</b> here; curtailment is <b>LIFO / shared pro-rata</b> by connection order. Because West Newton A would <b>export</b> (a 0.99 MW generator), it sits <b>inside</b> this scheme — accepting ANM curtailment in exchange for a fast, non-firm connection. As a new entrant it joins at the <b>bottom of the LIFO stack</b> (curtailed first), but a gas peaker mainly runs at high-price / low-wind hours, when local export congestion — and so curtailment — is lowest.</div><table class="d"><tr><th>ANM-managed generator</th><th>MW</th><th>Type</th></tr><tr><td>Fraisthorpe Wind Farm</td><td>30.6</td><td>Wind</td></tr><tr><td>Lissett Airfield Wind Farm</td><td>30</td><td>Wind</td></tr><tr><td>Harmony Energy BESS (Pocklington)</td><td>30</td><td>Battery</td></tr><tr><td>Tansterne Biomass</td><td>22</td><td>Biomass</td></tr><tr><td>Withernwick Wind Farm</td><td>18.1</td><td>Wind</td></tr><tr><td>Roos Wind Farm</td><td>17.1</td><td>Wind</td></tr><tr><td colspan=2>+ 8 smaller (PV, engines, CHP)</td><td>~18</td></tr><tr><th>Total curtailable</th><th>~166</th><th></th></tr></table><div class="note" style="border:0;margin:4px 0 0;padding:0">Source: NPg Embedded Capacity Register (flexible-connection = Yes) + planning evidence (Little Crow, N. Lincs GEP grid offers). Zone outline on the map is the GSP-group hull — indicative, not an official NPg boundary.</div></details><details class="sec"><summary class="sh">Substation headroom — RAG <span style="font-weight:normal;text-transform:none;color:#888">(toggle layer)</span></summary><div class="note" style="border:0;margin:0 0 5px;padding:0"><b>Generation headroom = 0 MW at every one of the 42 Creyke Beck + 13 Saltend North primaries</b> — the area cannot take more export. <b>Demand</b> headroom is the opposite story.</div><table class="d"><tr><th>Primary</th><th>Firm</th><th>Dem HR</th><th>Limit</th></tr><tr><td><b>Burton Pidsea</b> (WN)</td><td>9 MVA</td><td>5.09 MW</td><td style="color:#c0392b">Red — fault</td></tr><tr><td>Holderness</td><td>23</td><td>11.6</td><td style="color:#2e9e4f">Green</td></tr><tr><td>Hedon Road</td><td>23</td><td>n/p</td><td style="color:#2e9e4f">Green</td></tr><tr><td>Seaton</td><td>20</td><td>2.9</td><td style="color:#c0392b">Red — fault</td></tr></table><div class="note" style="border:0;margin:4px 0 0;padding:0">Diamonds on the map are coloured by <b>demand</b>-side constraint: <span style="color:#2e9e4f">◆ green</span> = spare, <span style="color:#e8a33d">◆ amber</span>, <span style="color:#c0392b">◆ red</span> = constrained (mostly fault-level). Click any for firm capacity, max demand and both headrooms. Saltend North demand headroom is not populated in NPg’s data (shown n/p). Source: NPg Open Data network heat map, Jun 2026.</div></details><details class="sec"><summary class="sh">Grid connection status</summary>'+

 '<div class="note"><b>Constraint (extracted from NESO + NPg data):</b> GB thermal-constraint cost <b>£1.96 bn in 2025/26</b> (~14 TWh turned down; up from £1.71 bn in 24/25). West Newton sits <b>behind boundary B8</b> (N. England→Midlands, <b>11 GW cap</b>, Keadby–West Burton 400 kV) and B7a (9.4 GW) — the <b>constrained export side, the same side Dogger Bank injects</b>. A 0.99 MW exporter is negligible at the GW-scale B8 boundary, but on the local 66/11 kV network it adds export where firm headroom is zero — which is exactly why the connection must be <b>non-firm / ANM-curtailable</b>. The Humber export group <b>NKILGRMO</b> was <b>binding ~38.5%</b> of 2026 (avg 2,135 vs 3,195 MW limit); the whole Creyke Beck GSP group shows <b>0 MW generation headroom at all 42 primaries</b> (NPg heat map, Jun 2026), with <b>~166 MW of ANM-managed generation</b> already curtailable across the two Hull-area GSP groups. <i>(The earlier “58 events / 182 GWh curtailed” figure is unverified — NPg’s curtailment-events dataset is access-restricted, and its energy field is in <b>MWh</b>, so any “GWh” reading is likely a 1000× unit error.)</i> Birkhill Wood adds another 4.22 GW connecting nearby. Import (demand) headroom at <b>Burton Pidsea = 5.09 MW</b> (NPg heat map Jun 2026; 4.79 MW on the NPg NDP, Apr 2026) — ample for any site import — but this is a peaker <b>EXPORT</b> project, so the binding local figure is the <b>0 MW generation headroom</b>, and the primary is <b>RED on fault level</b> — a separate hard limit that ANM does not solve.<br><span style="color:#888">Offshore boundary <b>EC1</b> = Hornsea→Killingholme (not us); Creyke Beck / Dogger Bank = <b>EC3 / EC7</b>.</span></div>'+
 '</details><details class="sec"><summary class="sh">Peaker export — thesis &amp; route to market</summary><div class="note" style="border:0;margin:0 0 5px;padding:0"><b>0.99 MW non-firm export</b> from a ~1.3 MW wellhead-gas genset. Near-free wellhead gas + the sub-threshold exemptions below collapse marginal cost to <b>O&amp;M only (~£5–15/MWh)</b> vs a merchant peaker&#39;s £90–150 — in-merit in almost every positive-price hour, not just the top 10–20%. The co-located Bitcoin mine is the switchable offtake / hedge.</div><table class="d"><tr><th>Route</th><th>How it works here</th></tr><tr><td><b>Wholesale peak</b></td><td>Sell at high prices — 2025 had ~1,722 h &gt;£100/MWh (~20% of the year)</td></tr><tr><td><b>Balancing Mechanism</b></td><td>Via a Virtual Lead Party; 0.99 MW is just below the ~1 MW standalone unit min, so <b>aggregate</b> into a &ge;1 MW BMU</td></tr><tr><td><b>Capacity Market</b></td><td>Weak: 2 MW min, annual-emissions run-hour cap, firm-delivery vs a curtailable connection — optional only</td></tr></table><div class="note" style="border:0;margin:4px 0 0;padding:0"><b>Carbon &amp; levy exemptions — where they kick in:</b> genset &le;2 MW &rarr; <b>no Carbon Price Support</b> + CCL generation relief; ~3 MWth &rarr; <b>outside UK ETS</b> (20 MWth entry); exporter pays <b>no BSUoS</b> (demand-only since Apr 2023) and no consumption levies (RO/CfD/CM/FiT) on exported power; the mine self-supplies behind the meter, dodging the ~6 p/kWh grid stack.</div></details><details class="sec"><summary class="sh">Connection concept &amp; indicative cost</summary><div class="note" style="border:0;margin:0 0 5px;padding:0">The 11 kV cable runs <b>through WN A</b> (~19 m from the data-centre). NPg inserts a <b>switched point (RMU)</b> on the cable; on-site you build a <b>step-up substation</b> (0.4/11 kV) with G99 Type-B protection, an <b>export-limitation relay</b> (export &le;0.99 MW) and the <b>ANM interface</b> (RTU + comms). Sizing at 0.99 MW keeps it <b>below the 1 MW fault-level TIA floor</b> (no Transmission Impact Assessment at any GSP) and outside the NESO Gate-2 queue.</div><table class="d"><tr><th>Item</th><th>Indicative</th></tr><tr><td>Point of connection (RMU + ~19 m cable, own land)</td><td>£25–80k</td></tr><tr><td>Step-up substation (~2 MVA) + switchgear</td><td>£55–135k</td></tr><tr><td>G99 protection + ANM interface + HH metering</td><td>£45–120k</td></tr><tr><td>Design, PM, contingency (wayleaves &asymp; £0)</td><td>£25–70k</td></tr><tr><th>Total connection capex</th><th>~£150–410k (central ~£280k)</th></tr></table><div class="note" style="border:0;margin:4px 0 0;padding:0"><b>Timeline ~12–24 months</b> (central ~15–18) vs 5–10 yr for a firm connection. <b>Key check — fault level:</b> Burton Pidsea is <b>RED</b>, a separate hard constraint that <b>ANM does not solve</b> (ANM throttles power flow; fault level is the switchgear short-circuit limit). The step-up transformer impedance limits your fault contribution; confirm at NPg budget-estimate stage. Curtailment is <b>LIFO</b> — request NPg&#39;s indicative curtailment assessment.</div>'+
