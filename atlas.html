const map=L.map('map',{preferCanvas:true}).setView([55,-3],6);

const layer=L.layerGroup().addTo(map);
let cur='hydro';
function render(){
  const a=ATLAS[cur]; layer.clearLayers();
  let f=a.data.filter(a.ok);const q=(gid('q').value||'').trim().toLowerCase();if(q)f=f.filter(d=>[d.site,d.operator,d.outcode,d.postcode,d.local_authority,d.town].some(v=>v&&(''+v).toLowerCase().includes(q)));
  const tn=gid('topn'); if(tn&&tn.checked) f=[...f].sort((x,y)=>x.rank-y.rank).slice(0,30);
