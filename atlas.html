const map=L.map('map',{preferCanvas:true}).setView([55,-3],6);

const layer=L.layerGroup().addTo(map);
let cur='hydro';
function render(){
  const a=ATLAS[cur]; layer.clearLayers();
  let f=a.data.filter(a.ok);const q=(gid('q').value||'').trim().toLowerCase();if(q)f=f.filter(d=>[d.site,d.operator,d.outcode,d.postcode,d.local_authority,d.town,d.name].some(v=>v&&(''+v).toLowerCase().includes(q)));
  const tn=gid('topn'); if(tn&&tn.checked) f=[...f].sort((x,y)=>x.rank-y.rank).slice(0,30);
  let cap=0;
  f.forEach(d=>{var kw=(a.kw?a.kw(d):d.installed_kw)||0;cap+=kw;
    L.circleMarker([d.lat,d.lon],{radius:rad(kw),fillColor:a.colour(d),color:'#222',weight:.6,fillOpacity:.85}).bindPopup(a.popup(d)).addTo(layer);});
  gid('count').textContent=f.length; gid('mw').textContent=(cap/1000).toFixed(1);
}
function setTab(name){
  cur=name; const a=ATLAS[name];
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  gid('ftitle').textContent=a.ftitle; gid('fmuted').innerHTML=a.fmuted;
  gid('univ').innerHTML='Universe<b>'+a.univ+'</b>';
  gid('legtitle').textContent=a.legtitle;
  gid('legrows').innerHTML=a.legend.map(r=>'<div class="row"><span class="dot" style="background:'+r[0]+'"></span> '+r[1]+'</div>').join('');
  gid('filters').innerHTML=a.filters;
  gid('filters').querySelectorAll('input').forEach(el=>el.addEventListener('input',render));
  map.setView(a.center,a.zoom);
  render();
}
gid('tabs').innerHTML=Object.keys(ATLAS).map(k=>'<button class="tabbtn" data-tab="'+k+'">'+ATLAS[k].label+'</button>').join('');
