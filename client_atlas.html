   legend:[['#800026','Tier 1<span class="leg-fig">29.6p avg · 122p top 5%</span>'],['#e31a1c','Tier 2<span class="leg-fig">25.3p avg · 104p top 5%</span>'],['#fd8d3c','Tier 3<span class="leg-fig">21.7p avg · 80p top 5%</span>'],['#fed976','Tier 4<span class="leg-fig">18.0p avg · 61p top 5%</span>'],['#a6a6a6','Tier 5<span class="leg-fig">16.0p avg · 50p top 5%</span>']],
   filters:'<label><input type="checkbox" id="t1" checked> Tier 1 - Highest</label><label><input type="checkbox" id="t2" checked> Tier 2 - Strong</label><label><input type="checkbox" id="t3" checked> Tier 3 - Moderate</label><label><input type="checkbox" id="t4" checked> Tier 4 - Modest</label><label><input type="checkbox" id="t5" checked> Tier 5 - Lower</label><label><input type="checkbox" id="topn"> Top 30 by rank only</label>',
   colour:d=>pcol(d.tier),
   ok:d=>{const b=gid('t'+d.tier);return b?b.checked:true;},
   popup:d=>'<div class="pk-pop"><div class="pk-name">'+esc(PNAME(d))+(d.installed_kw?' <span class="pk-kw">'+fmt(d.installed_kw)+' kW</span>':'')+'</div><div class="pk-tier">Tier '+d.tier+'</div><div class="pk-rev-h">Projected Balancing Mechanism Revenues</div><div class="pk-rev-v">Average <b>'+(BMREV[d.tier]?BMREV[d.tier].a:'—')+' p/kWh</b><br>Top 5% <b>'+(BMREV[d.tier]?BMREV[d.tier].t:'—')+' p/kWh</b></div>'+(BMFREQ[d.tier]?'<div class="pk-freq">Offer-event frequency: <b>'+BMFREQ[d.tier]+' GB average</b></div>':'')+'</div>'
 }
};
const map=L.map('map',{preferCanvas:true}).setView([55,-3],6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap &middot; geocoding postcodes.io &middot; RenewaBlox CRM'}).addTo(map);
const layer=L.layerGroup().addTo(map);
let cur='hydro';
function render(){
  const a=ATLAS[cur]; layer.clearLayers();
  const q=(gid('q')?gid('q').value:'').trim().toLowerCase();
  let rows=a.data;
  if(q){const f=a.search||[];rows=rows.filter(d=>f.some(k=>{var v=d[k];return v!=null&&(''+v).toLowerCase().indexOf(q)>=0;}));}
  const ms=gid('mwsel')?gid('mwsel').value:'all';
  if(ms!=='all'){rows=rows.filter(d=>{var c=(a.cap?a.cap(d):d.installed_kw)||0;return ms==='over'?c>1000:c<=1000;});}
  let cap=0;const pts=[];
  rows.forEach(d=>{var kw=(a.kw?a.kw(d):d.installed_kw)||0;cap+=kw;pts.push([d.lat,d.lon]);
    L.circleMarker([d.lat,d.lon],{radius:rad(kw),fillColor:a.colour(d),color:'#222',weight:.6,fillOpacity:.85}).bindPopup(a.popup(d)).addTo(layer);});
  const mw=gid('mw'); if(mw) mw.textContent=(cap/1000).toFixed(1);
  const h=gid('qhits'); if(h) h.textContent=(q||ms!=='all')?(rows.length+' site'+(rows.length===1?'':'s')+' shown'):'';
  if(q&&pts.length){map.fitBounds(pts,{padding:[40,40],maxZoom:12});}
}
function setTab(name){
  cur=name; const a=ATLAS[name];
  gid('tab_hydro').classList.toggle('active',name==='hydro');
  gid('tab_peaker').classList.toggle('active',name==='peaker');
  gid('univ').innerHTML='Universe<b>'+a.univ+'</b>';
  gid('legtitle').textContent=a.legtitle;
  gid('legrows').innerHTML=a.legend.map(r=>'<div class="row"><span class="dot" style="background:'+r[0]+'"></span> '+r[1]+'</div>').join('');
  map.setView(a.center,a.zoom);
  render();
}
gid('tab_hydro').addEventListener('click',()=>setTab('hydro'));
gid('tab_peaker').addEventListener('click',()=>setTab('peaker'));
gid('q').addEventListener('input',render);gid('mwsel').addEventListener('change',render);setTab('peaker');
</script></body></html>
