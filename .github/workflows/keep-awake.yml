name: Keep apps awake

# Streamlit Community Cloud sleeps free-tier apps after a few hours idle, and a
# plain HTTP ping (UptimeRobot, curl, /_stcore/health) returns 200 WITHOUT waking
# them — the Python app only really wakes when a browser opens its WebSocket
# session. So this job loads each app in headless Chromium (Playwright): that
# opens the WebSocket (resetting the idle timer) and clicks the "get this app
# back up" button if an app had already gone to sleep. Partners then never meet
# the sleep screen.
#
# Every 3h is well inside the (~12h, sometimes less) sleep window and survives an
# occasional skipped/late run — GitHub does not guarantee exact schedule timing.
# The Playwright browser is cached so each run is ~1 min of CI time. Public repos
# get unlimited free Actions minutes; on a private repo this is a few hundred
# min/month — dial the cron down if you approach the free 2,000-min cap.

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours, UTC
  workflow_dispatch:

permissions:
  contents: read    # checkout only
  issues: write     # open an alert issue if an app can't be woken

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (no LFS — we only need the small script)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit each app to keep it awake
        run: python .github/scripts/keep_awake.py

      - name: Alert on failure (open/append a GitHub issue, assigned to you)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = 'keep-awake-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `The **keep-awake** check failed on ${today} (UTC) — one or more hosted apps could`,
              `not be confirmed running, so partners may be seeing the Streamlit sleep screen.`,
              ``,
              `- Failed run: ${runUrl}`,
              `- Apps: https://eunice.streamlit.app/ · https://renewablox-savings.streamlit.app/`,
              ``,
              `Open each link to check. If a "get this app back up" button shows, the keep-alive`,
              `step needs a look (Streamlit may have changed the sleep page, or an app errored on boot).`,
              ``,
              `cc @${context.repo.owner}`,
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: marker,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Keep-awake failed — apps may be asleep',
                body, labels: [marker], assignees: [context.repo.owner],
              });
            }
