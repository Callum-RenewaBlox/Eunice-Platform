name: Daily refresh

# Daily pipeline: pull tariff / weather / grid data, retrain the 7-day model, regenerate
# predictions, then rebuild the SLIM database (data_lite.sqlite) the hosted apps read and
# commit ONLY that small file.
#
# Why it's built this way:
#   - The full 110 MB data.sqlite is needed only for retraining, not at runtime. It is kept
#     in a GitHub Actions cache between runs (NOT committed daily) — so there is no Git LFS
#     storage growth and no LFS download on the hot path. A frozen copy in the repo serves as
#     a one-time seed if the cache is ever evicted; incremental ingest then fills any gap.
#   - Only data_lite.sqlite (≈2 MB, a normal git file) is committed each day. Streamlit Cloud
#     reads that reliably (it cannot read Git LFS), and the daily diff is tiny.
#
# Trigger: 16:35 UTC daily (Octopus publishes day-ahead rates ~16:00 UK). Manual run allowed.

on:
  schedule:
    - cron: "35 16 * * *"
  workflow_dispatch:

permissions:
  contents: write   # required to commit the refreshed slim DB back

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout (no LFS — the big DB comes from cache, not git)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore working database from cache
        uses: actions/cache@v4
        with:
          path: data.sqlite
          # Unique key each run + prefix restore-keys = a rolling cache: restore the most
          # recent prior DB, then save an updated one at job end for tomorrow.
          key: eunice-db-${{ github.run_id }}
          restore-keys: |
            eunice-db-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed database from Git LFS if the cache missed
        run: |
          if [ ! -f data.sqlite ] || [ "$(stat -c%s data.sqlite)" -lt 100000 ]; then
            echo "No usable cached DB — seeding the frozen copy from Git LFS."
            git lfs pull --include data.sqlite || echo "LFS seed unavailable; will full-rebuild."
          fi

      - name: Ingest + retrain + predict
        env:
          # Optional — Open-Meteo is the canonical weather source, so the model trains fine
          # without this. Add it in repo Settings → Secrets to enable the Met Office sanity check.
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
        run: |
          if [ ! -f data.sqlite ] || [ "$(stat -c%s data.sqlite)" -lt 100000 ]; then
            echo "No seed available — full rebuild from source APIs."
            rm -f data.sqlite
            python ingest.py --full
          else
            python ingest.py
          fi

      - name: Rebuild slim deploy database
        run: python build_lite_db.py

      - name: Commit the slim DB (small, normal file — no LFS)
        run: |
          git config user.name  "eunice-bot"
          git config user.email "eunice-bot@users.noreply.github.com"
          if ! git diff --quiet -- data_lite.sqlite; then
            git add data_lite.sqlite
            git commit -m "chore: daily prediction refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No change to data_lite.sqlite — skipping commit."
          fi
