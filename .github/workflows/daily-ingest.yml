name: Daily refresh

# Daily pipeline: pull tariff / weather / grid data, retrain the 7-day model, regenerate
# predictions, then rebuild the SLIM database (data_lite.sqlite) the hosted apps read and
# commit ONLY that small file.
#
# Why it's built this way:
#   - The full 110 MB data.sqlite is needed only for retraining, not at runtime. It is kept
#     in a GitHub Actions cache between runs (NOT committed daily) — so there is no Git LFS
#     storage growth and no LFS download on the hot path. A frozen copy in the repo serves as
#     a one-time seed if the cache is ever evicted; incremental ingest then fills any gap.
#   - Only data_lite.sqlite (≈2 MB, a normal git file) is committed each day. Streamlit Cloud
#     reads that reliably (it cannot read Git LFS), and the daily diff is tiny.
#
# Triggers:
#   16:35 UTC — full ingest (legacy engine) + rebuilt engine's 16:35-London origin (targets D+2..D+7).
#               Octopus publishes day-ahead rates ~16:00 UK, so D+1 prices are known by then.
#   09:45 UTC — rebuilt engine's 10:00-London "tomorrow" origin only (targets D+1..D+7); the
#               legacy ingest is skipped (no new Agile prices at that hour).
# Manual run allowed (behaves like the 16:35 run).

on:
  schedule:
    - cron: "35 16 * * *"
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed slim DB back
  issues: write     # open an alert issue if the refresh fails

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # normal runs take minutes; the one-off rebuild-store seed can take ~1 h

    steps:
      - name: Checkout (no LFS — the big DB comes from cache, not git)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore working database from cache
        uses: actions/cache@v4
        with:
          path: data.sqlite
          # Unique key each run + prefix restore-keys = a rolling cache: restore the most
          # recent prior DB, then save an updated one at job end for tomorrow.
          # (Kept as a single-path cache so existing eunice-db-* caches keep restoring —
          # actions/cache versions caches by their path list.)
          key: eunice-db-${{ github.run_id }}
          restore-keys: |
            eunice-db-

      - name: Restore rebuild stores + model bundle from cache
        uses: actions/cache@v4
        with:
          # The rebuilt engine's feature stores, live-issue stores and persisted model bundle
          # (all regenerable, none in git). Separate cache so the DB cache above is untouched.
          path: |
            rebuild/data
            rebuild/out
          key: eunice-rebuild-${{ github.run_id }}
          restore-keys: |
            eunice-rebuild-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed database from Git LFS if the cache missed
        run: |
          if [ ! -f data.sqlite ] || [ "$(stat -c%s data.sqlite)" -lt 100000 ]; then
            echo "No usable cached DB — seeding the frozen copy from Git LFS."
            git lfs pull --include data.sqlite || echo "LFS seed unavailable; will full-rebuild."
          fi

      - name: Ingest + retrain + predict (legacy engine — 16:35 runs only)
        if: github.event.schedule != '45 9 * * *'
        env:
          # Optional — Open-Meteo is the canonical weather source, so the model trains fine
          # without this. Add it in repo Settings → Secrets to enable the Met Office sanity check.
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
        run: |
          if [ ! -f data.sqlite ] || [ "$(stat -c%s data.sqlite)" -lt 100000 ]; then
            echo "No seed available — full rebuild from source APIs."
            rm -f data.sqlite
            python ingest.py --full
          else
            python ingest.py
          fi

      - name: Seed rebuild feature stores if the cache missed (one-off cold start)
        run: |
          if [ ! -f rebuild/data/features_1635.parquet ] || [ ! -f rebuild/data/features_1000.parquet ]; then
            echo "Rebuild feature stores missing — regenerating from source archives (~1 h, one-off)."
            echo "NOTE: the archive scripts have hard-coded end dates (Aug 2026); origins between"
            echo "that and today are filled forward by the daily pipeline's live stores."
            python rebuild/fetch_neso.py
            python rebuild/fetch_octopus.py AGILE-24-10-01 K
            python rebuild/fetch_octopus.py AGILE-BUS-25-02-05 K
            python rebuild/fetch_elexon.py WINDFOR
            python rebuild/build_asof_embedded.py
            python rebuild/build_features.py 1635
            python rebuild/add_lastknown_feats.py 1635
            python rebuild/build_features.py 1000
            python rebuild/add_lastknown_feats.py 1000
          fi

      - name: Rebuilt engine — origin features, region-K prediction, all-region write
        id: rebuilt
        # continue-on-error so a rebuilt-engine failure (e.g. late Octopus publication) cannot
        # block the legacy refresh + lite-DB commit below; the failure is re-raised after the
        # commit so the alert issue still fires.
        continue-on-error: true
        run: |
          if [ "${{ github.event.schedule }}" = "45 9 * * *" ]; then
            python rebuild/write_predictions.py 1000
          else
            python rebuild/write_predictions.py 1635
          fi

      - name: Archive forecast vintages (NESO / Elexon / Met Office issues)
        env:
          METOFFICE_API_KEY: ${{ secrets.METOFFICE_API_KEY }}
        # per-source failures are internal warnings; the step only fails if every source fails
        run: python capture_vintages.py

      - name: Compute the live scorecard from stored vintages
        run: python compute_scorecard.py

      - name: Sync durable tables to BigQuery (no-op until GCP_SA_KEY exists)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then pip install -q google-cloud-bigquery; fi
          python bq_sync.py

      - name: Rebuild slim deploy database
        run: python build_lite_db.py

      - name: Commit the slim DB (small, normal file — no LFS)
        run: |
          git config user.name  "eunice-bot"
          git config user.email "eunice-bot@users.noreply.github.com"
          if ! git diff --quiet -- data_lite.sqlite; then
            git add data_lite.sqlite
            git commit -m "chore: daily prediction refresh $(date -u +%Y-%m-%d)"
            # main may have moved while this job ran — replay our commit on top, keeping OUR
            # freshly built data_lite on any conflict (-X theirs favours the replayed commit)
            git pull --rebase -X theirs origin main
            git push
          else
            echo "No change to data_lite.sqlite — skipping commit."
          fi

      - name: Fail the job if the rebuilt engine failed (commit above is already safe)
        if: steps.rebuilt.outcome == 'failure'
        run: |
          echo "Rebuilt-engine step failed — see its log. Failing the job so the alert fires."
          exit 1

      - name: Alert on failure (open/append a GitHub issue, assigned to you)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = 'refresh-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const body = [
              `The daily Eunice data refresh **failed** on ${today} (UTC).`,
              ``,
              `- Failed run: ${runUrl}`,
              ``,
              `The hosted app keeps serving the last good predictions and live prices, but the`,
              `forecast will not update until this is resolved. The app shows a staleness warning`,
              `to anyone viewing it in the meantime.`,
              ``,
              `cc @${context.repo.owner}`,
            ].join('\n');
            // Dedupe: if an alert issue is already open, comment on it instead of spamming new ones.
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: marker,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Daily refresh failed — predictions not updating',
                body, labels: [marker], assignees: [context.repo.owner],
              });
            }
